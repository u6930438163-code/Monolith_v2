# Starting configuration for LibreChat. Validate against the deployed release.
version: 1.2.1
cache: true
endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "${OLLAMA_BASE_URL}"
      models:
        default: ["gemma3:4b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama"
# Pull model on Ollama host: ollama pull gemma3:4b
# Gemini: configure GOOGLE_KEY using official LibreChat instructions.
# Monolith tools/agents: not enabled until authenticated backend exists.
